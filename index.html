<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: one-column phone app — sticky header, scrolling view, fixed tab bar, bottom sheets. Category colours carry the identity. */
:root{
  /* Leona: parchment & brass by day, forged iron by night; crimson scarf, crystal teal, jewel-tone categories */
  --bg:#F2EADB; --surface:#FBF7EE; --surface-2:#ECE2CF; --ink:#2A221C; --ink-2:#6E5F50; --line:#DACBB0;
  --accent:#A61E32; --accent-on:#FFF6EA; --focus:#138A86; --brass:#B8893B; --now-bg:#2E2620; --now-fg:#F6EEDF;
  --c1:#2F5BA8; --c1-on:#FFFFFF;  /* Termin – Saphir */
  --c2:#138A86; --c2-on:#FFFFFF;  /* Arbeit – Kristall */
  --c3:#D9A23A; --c3-on:#2A1D05;  /* Haushalt – Gold */
  --c4:#C9446C; --c4-on:#FFFFFF;  /* Gesundheit – Rosenrot */
  --c5:#7E4DB3; --c5-on:#FFFFFF;  /* Freizeit – Amethyst */
  --c6:#5E9A3E; --c6-on:#FFFFFF;  /* Pause – Moos */
  --s1:#D64545; --s2:#E58A3C; --s3:#E6C23A; --s4:#8DBB45; --s5:#3A9E62;
  --shadow:0 8px 22px rgba(70,45,20,.13);
  --scrim:rgba(30,20,12,.5);
  --f-display:"Cinzel", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161B; --surface:#20222A; --surface-2:#2B2E38; --ink:#EEE6D6; --ink-2:#A89E8C; --line:#3A3C46;
    --accent:#D2384E; --accent-on:#FFF3EC; --focus:#3FC4BF; --brass:#C99A4A; --now-bg:#262833; --now-fg:#EEE6D6;
    --c1:#6E95E0; --c1-on:#0B1530; --c2:#2FC0B9; --c2-on:#032321; --c3:#E8B54E; --c3-on:#2A1D05;
    --c4:#E2668C; --c4-on:#2A0712; --c5:#A97BDA; --c5-on:#1E0B33; --c6:#86C062; --c6-on:#10220A;
    --shadow:0 8px 24px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#15161B; --surface:#20222A; --surface-2:#2B2E38; --ink:#EEE6D6; --ink-2:#A89E8C; --line:#3A3C46;
    --accent:#D2384E; --accent-on:#FFF3EC; --focus:#3FC4BF; --brass:#C99A4A; --now-bg:#262833; --now-fg:#EEE6D6;
    --c1:#6E95E0; --c1-on:#0B1530; --c2:#2FC0B9; --c2-on:#032321; --c3:#E8B54E; --c3-on:#2A1D05;
    --c4:#E2668C; --c4-on:#2A0712; --c5:#A97BDA; --c5-on:#1E0B33; --c6:#86C062; --c6-on:#10220A;
    --shadow:0 8px 24px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.label{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

.cat-termin{--c:var(--c1);--on:var(--c1-on)}
.cat-arbeit{--c:var(--c2);--on:var(--c2-on)}
.cat-haushalt{--c:var(--c3);--on:var(--c3-on)}
.cat-gesund{--c:var(--c4);--on:var(--c4-on)}
.cat-freizeit{--c:var(--c5);--on:var(--c5-on)}
.cat-pause{--c:var(--c6);--on:var(--c6-on)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(110px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:26px;font-weight:800;flex:1;min-width:0}
header.top .sub{display:block;font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--ink-2);letter-spacing:0}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.pillbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--accent);color:var(--accent-on);min-height:48px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.small{min-height:38px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn.danger{background:transparent;color:var(--c4);border:1.5px solid var(--c4)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* Now card */
.now{background:var(--now-bg);color:var(--now-fg);--bg:var(--now-fg);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.now .label{color:inherit;opacity:.7}
.now-title{font-family:var(--f-body);font-size:24px;font-weight:800;line-height:1.15}
.bar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.next{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--bg) 12%,transparent);border-radius:14px;padding:10px 12px}
.next .dot{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.countdown{font-family:var(--f-body);font-weight:800;font-size:20px}

.nudge{display:flex;gap:14px;align-items:center;background:var(--c3);color:var(--c3-on);border-radius:var(--r);padding:14px 16px}
.nudge b{display:block;font-family:var(--f-display);font-size:18px}
.nudge .btn{background:var(--c3-on);color:var(--c3)}
.focuschip{display:flex;gap:10px;align-items:center;border:2px dashed var(--accent);border-radius:var(--r);padding:12px 14px}
.focuschip b{font-family:var(--f-body);font-size:18px}

/* Timeline */
.tl{position:relative;margin-left:44px;border-left:1.5px solid var(--line)}
.tl .hr{position:absolute;left:-44px;width:calc(100% + 44px);border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.tl .hr span{position:absolute;top:-9px;left:0;background:var(--bg);padding-right:6px}
.tl .nowline{position:absolute;left:-6px;right:0;height:0;border-top:2.5px solid var(--accent);z-index:3}
.tl .nowline::before{content:"";position:absolute;left:-5px;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.blk{position:absolute;border:0;text-align:left;border-radius:12px;padding:6px 10px;background:var(--c);color:var(--on);overflow:hidden;display:flex;flex-direction:column;gap:2px;z-index:2;box-shadow:0 2px 0 color-mix(in srgb,var(--c) 60%,#000)}
.blk b{font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.blk.tiny b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
.blk small{font-size:12px;opacity:.9}
.blk.done{opacity:.4}
.blk.done b{text-decoration:line-through}

.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px;border-left:0;box-shadow:var(--shadow)}
.task .t{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.task .t b{display:block;overflow-wrap:anywhere}
.task.done .t b{text-decoration:line-through;color:var(--ink-2)}
.check{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c,var(--ink-2));background:transparent;display:grid;place-items:center;flex:none;padding:0}
.check.on{background:var(--c,var(--ink-2))}
.check svg{width:16px;height:16px;stroke:var(--on,#fff)}
.swatch{width:12px;height:12px;border-radius:4px;background:var(--c);display:inline-block;flex:none}

/* Month */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid .wd{text-align:center;font-size:12px;font-weight:700;color:var(--ink-2);padding:4px 0}
.day{aspect-ratio:1/1.1;max-width:100%;border:0;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px;gap:4px;position:relative}
.day.out{opacity:.35}
.day.today{background:var(--ink);color:var(--bg)}
.day .n{font-weight:700;font-size:15px}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:30px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.day .mig{position:absolute;top:4px;right:5px;width:7px;height:7px;transform:rotate(45deg);background:var(--c4)}
.agenda-day{display:flex;flex-direction:column;gap:8px}
.agenda-day h3{font-size:16px}

/* Focus */
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .time{font-family:var(--f-body);font-size:56px;font-weight:800;line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;min-height:40px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.cat{background:var(--surface)}
.chip.cat.on{background:var(--c);color:var(--on);border-color:var(--c)}

/* Tools */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;text-align:left;border-radius:20px;padding:16px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;background:var(--c);color:var(--on)}
.tile h3{font-size:20px}
.tile p{margin:0;font-size:14px;opacity:.92}
.tile.plain{background:var(--surface);color:var(--ink);border:2px dashed var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--surface-2);border-radius:14px;padding:10px}
.stat b{display:block;font-family:var(--f-body);font-size:24px}
.stat span{font-size:12px;color:var(--ink-2)}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:2px}
.strip i{height:28px;border-radius:3px;background:var(--surface-2)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:2px solid transparent;border-radius:12px;padding:10px 2px;font-size:12px;font-weight:700;background:var(--surface-2);min-height:52px;display:flex;flex-direction:column;align-items:center;gap:2px}
.scale button b{font-family:var(--f-body);font-size:18px}
.scale button.on{background:var(--sc);color:#1A1D2B;border-color:var(--ink)}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:90px}
.bars i{border-radius:4px 4px 2px 2px;background:var(--sc,var(--surface-2));min-height:4px}
.proj{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;width:100%;background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.proj .bar{background:var(--surface-2)}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h2{font-size:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:14px;font-weight:700}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:48px;font-size:16px}
textarea.inp{min-height:84px;resize:vertical}
.quick{border-color:var(--accent);border-width:2px}
.hint{font-size:13px;color:var(--ink-2)}
.field>span.hint{font-weight:400}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:center}
.step .inp{min-height:42px;padding:8px 10px}
.x{border:0;background:none;color:var(--ink-2);width:36px;height:36px;font-size:22px;flex:none}
.range{width:100%;accent-color:var(--accent)}
.note{background:var(--surface);border-radius:12px;padding:10px 12px}
.note small{display:block;color:var(--ink-2)}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:560px}
nav.tabs button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;white-space:nowrap;font-weight:700;color:var(--ink-2);min-height:58px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{stroke:var(--accent)}
.fab{position:fixed;z-index:9;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-on);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:30px;height:30px}

/* Alert */
.alert{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));max-width:540px;margin:0 auto;background:var(--c,var(--accent));color:var(--on,var(--accent-on));border-radius:20px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px}
.alert b{font-family:var(--f-body);font-size:20px}
.alert .btn{background:var(--on,#fff);color:var(--c,var(--accent))}
.alert .btn.ghost{background:transparent;color:inherit;border:2px solid currentColor}
.toast{position:fixed;z-index:31;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
.durrow{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.durrow .inp{min-width:0}
/* Entry form */
.sheet.ev{padding-bottom:0}
.sh-head{display:flex;align-items:center;gap:8px}
.sh-head h2{flex:1}
.blockcard{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--k) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--k) 45%,transparent)}
.blockcard.b1{--k:var(--c3)} .blockcard.b2{--k:var(--c1)} .blockcard.b3{--k:var(--c5)}
.bc-h{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:19px}
.bc-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--k);color:var(--surface);font-size:16px;flex:none}
.blockcard.b1 .bc-n{color:var(--c3-on)}
.inp.big{font-size:19px;font-weight:700;min-height:56px;border-width:2px;border-color:color-mix(in srgb,var(--k) 60%,var(--line))}
.parsed{display:flex;flex-wrap:wrap;gap:6px;min-height:22px;align-items:center}
.pchip{background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.catbtn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:64px}
.catbtn i{width:18px;height:18px;border-radius:50%;background:var(--c)}
.catbtn.on{background:var(--c);color:var(--on);border-color:var(--ink)}
.catbtn.on i{background:var(--on)}
.extras{display:flex;flex-direction:column;gap:8px}
.xrow{background:var(--surface);border-radius:16px;border:1.5px solid var(--line);overflow:hidden}
.xhead{width:100%;border:0;background:none;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;min-height:56px}
.xhead .xi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 22%,var(--surface));color:var(--ink);flex:none}
.xhead .xi svg{width:18px;height:18px}
.xhead b{display:block}
.xhead .chev{width:20px;height:20px;transition:transform .2s;flex:none;color:var(--ink-2)}
.xrow.open .chev{transform:rotate(90deg)}
.xbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.savebar{position:sticky;bottom:0;z-index:2;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.preview{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.preview::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.savebtn{width:100%;font-size:18px;min-height:54px}
.blockcard .bc-n{color:var(--kon,var(--surface))}
.dayprog{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:12px;border-radius:6px;background:color-mix(in srgb,var(--c) 22%,var(--surface-2))}
.segs i.on{background:var(--c)}
.checkin{width:100%;border:0;text-align:left;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-height:60px}
.checkin b{display:block}
.checkin .chev{width:20px;height:20px;color:var(--ink-2);flex:none}
.mdot{width:30px;height:30px;border-radius:50%;flex:none;background:conic-gradient(var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s1))}
.secthead{display:flex;align-items:center;gap:8px}
.secthead .cnt{background:var(--surface-2);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;color:var(--ink-2)}
.sev{display:flex;align-items:center;gap:14px}

const KEYS = ['events','migraine','projects','mood','sleep','cycle','meta','quest'];
const DEF = { events:[], migraine:[], projects:[], mood:{}, sleep:{}, cycle:{days:{},set:{len:28,plen:5}}, meta:{planned:{}, focusOf:{}}, quest:{coins:0,earned:0} };
const S = {};

S.meta.planned ||= {}; S.meta.focusOf ||= {};
let store = { mode:'local', db:null, uid:null, timers:{}, chain:{}, last:{} };

function save(k){
  ls.set(k,S[k]);
  if(store.mode!=='cloud') return;
  clearTimeout(store.timers[k]);
  store.timers[k] = setTimeout(()=>{
    const body = { v: S[k] };
    store.last[k] = JSON.stringify(S[k]);
    store.chain[k] = (store.chain[k]||Promise.resolve()).then(()=>
      store.db.doc(`data/users/${store.uid}/${k}`).set(body).catch(e=>{
        if(e && e.code==='quota_exceeded') toast('Speicher voll. Lösche alte Einträge.');
        else if(e && e.code==='unavailable') setTimeout(()=>save(k),1500);
      }));
  },500);
}
async function connect(){
  if(!window.claude || !window.claude.use) return;
  try{
    const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    store.db=db; store.uid=id;
    for(const k of KEYS){
      const ref = db.doc(`data/users/${id}/${k}`);
      const snap = await ref.get();
      if(snap.exists){ S[k] = structuredClone(snap.data().v ?? DEF[k]); ls.set(k,S[k]); }
      else if(JSON.stringify(S[k])!==JSON.stringify(DEF[k])){ await ref.set({v:S[k]}); }
    }
    S.meta.planned ||= {}; S.meta.focusOf ||= {};
    store.mode='cloud';
    for(const k of KEYS){
      db.doc(`data/users/${id}/${k}`).onSnapshot(snap=>{
        if(!snap.exists || snap.metadata.hasPendingWrites) return;
        const str = JSON.stringify(snap.data().v);
        if(str===JSON.stringify(S[k])) return;
        S[k] = JSON.parse(str); ls.set(k,S[k]);
        if(k==='meta'){ S.meta.planned ||= {}; S.meta.focusOf ||= {}; }
        softRender();
      }, ()=>{});
    }
    render();
  }catch(e){ /* stays local */ }
}

/* ---------- event queries ---------- */
const hasPh = e => !!(e && e.phases && e.phases.length);
const phTotal = e => e.phases.reduce((a,p)=>a+(+p.dur||0),0);
function phaseSegs(e){ let m=toMin(e.start); return e.phases.map((p,i)=>{ const s0=(p.at!=null && i>0)?p.at:m; m=s0+(+p.dur||0); return {i,p,abs:s0,end:m}; }); }
function phEndLabel(e){ const abs=e.start?phaseSegs(e).slice(-1)[0].end:phTotal(e), off=Math.floor(abs/1440); return fromMin(abs%1440)+(off===0?'':off===1?' (+1 Tag)':` (+${off} Tage)`); }
/* ---------- recurring series ---------- */
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'], WDL=['sonntags','montags','dienstags','mittwochs','donnerstags','freitags','samstags'];
const mondayOf = s => { const x=parseYmd(s); x.setDate(x.getDate()-((x.getDay()+6)%7)); return ymd(x); };
function occursOn(e,d){ const r=e.rep; if(!r) return e.date===d; if(d<e.date) return false; if(r.until && d>r.until) return false; if((e.skip||[]).includes(d)) return false;
  const n=Math.max(1,+r.n||1);
  if(r.f==='d') return dDiff(e.date,d)%n===0;
  if(r.f==='w'){ const days=(r.days&&r.days.length)?r.days:[parseYmd(e.date).getDay()]; if(!days.includes(parseYmd(d).getDay())) return false; return Math.round(dDiff(mondayOf(e.date),mondayOf(d))/7)%n===0; }
  if(r.f==='m'){ const a=parseYmd(e.date), b=parseYmd(d); if(a.getDate()!==b.getDate()) return false; return ((b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth())%n===0; }
  return false; }
function inst(e,d){ const o={...e, id:`${e.id}@${d}`, date:d, master:e.id, done:!!(e.doneOn&&e.doneOn[d]), missAck:!!(e.ackOn&&e.ackOn[d])};
  if(hasPh(e)) o.phases=e.phases.map(p=>({kind:p.kind,t:p.t,dur:p.dur})); return o; }
const expandNear = (e0,d) => e0.rep ? [addDays(d,-2),addDays(d,-1),d].filter(x=>occursOn(e0,x)).map(x=>inst(e0,x)) : [e0];
function detach(id){ const [mid,d]=id.split('@'); const m=S.events.find(x=>x.id===mid); if(!m) return null;
  const c=structuredClone(m); delete c.rep; delete c.doneOn; delete c.ackOn; delete c.skip; c.id=uid(); c.date=d; c.fromSeries=mid; c.done=!!(m.doneOn&&m.doneOn[d]);
  if(hasPh(c)) c.phases=c.phases.map(p=>({kind:p.kind,t:p.t,dur:p.dur}));
  m.skip=[...(m.skip||[]),d]; S.events.push(c); return c; }
function evGet(id){ if(!id) return null; id=id.split('#')[0]; return id.includes('@') ? detach(id) : S.events.find(x=>x.id===id); }
function occDone(id,val){ const [mid,d]=id.split('@'); const m=S.events.find(x=>x.id===mid); if(!m) return null; m.doneOn=m.doneOn||{}; if(val) m.doneOn[d]=true; else delete m.doneOn[d]; return m; }
function repTxt(r,date){ if(!r) return 'Nie'; const n=Math.max(1,+r.n||1); let t;
  if(r.f==='d') t= n===1?'Jeden Tag':`Alle ${n} Tage`;
  else if(r.f==='w'){ const days=(r.days&&r.days.length?r.days:[parseYmd(date).getDay()]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7));
    const wk = days.length===5 && [1,2,3,4,5].every(x=>days.includes(x));
    const dl = wk?'werktags': days.length===1?WDL[days[0]]:days.map(x=>WD[x]).join(', ');
    t = n===1?(wk?'Werktags':days.length===1?`Jeden ${['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][days[0]]}`:`Jede Woche: ${dl}`):`Alle ${n} Wochen ${dl}`; }
  else if(r.f==='m') t=(n===1?'Jeden Monat':`Alle ${n} Monate`)+` am ${parseYmd(date).getDate()}.`;
  return t+(r.until?` · bis ${fmtDay(r.until,{day:'numeric',month:'short'})}`:''); }

const evOn = d => { const out=[];
  for(const e0 of S.events) for(const e of expandNear(e0,d)){
    if(hasPh(e) && e.start){
      for(const g of phaseSegs(e)){ if(g.p.kind!=='do') continue; const day=addDays(e.date,Math.floor(g.abs/1440)); if(day!==d) continue;
        out.push({id:`${e.id}#${g.i}`, ph:{pid:e.id,i:g.i}, rep:e.rep, title:`${e.title}: ${g.p.t}`, short:g.p.t, cat:e.cat, date:day, start:fromMin(g.abs%1440), dur:Math.max(5,+g.p.dur||5), remind:e.remind==null?null:0, fixed:true, steps:[], done:!!g.p.done, missAck:!!g.p.ack}); }
    } else if(e.date===d) out.push(e);
  }
  return out; };
function waitsOn(d){ const out=[], D=parseYmd(d);
  for(const e0 of S.events) for(const e of expandNear(e0,d)){ if(!hasPh(e) || !e.start || e.done) continue;
    const off=Math.round((D-parseYmd(e.date))/864e5)*1440, segs=phaseSegs(e);
    segs.forEach((g,k)=>{ if(g.p.kind!=='wait') return; const nxt=segs.slice(k+1).find(z=>z.p.kind==='do'); if(nxt && nxt.p.done) return;
      const s0=g.abs-off, en=g.end-off; if(en<=0 || s0>=1440) return;
      const endDay=addDays(e.date,Math.floor(g.end/1440));
      out.push({pid:e.id, i:g.i, cat:e.cat, t:g.p.t, ptitle:e.title, s:Math.max(0,s0), e:Math.min(1440,en), endAt:parseYmd(e.date).getTime()+g.end*60000,
        endTxt:fromMin(g.end%1440)+(endDay===todayS()?'':endDay===addDays(todayS(),1)?' morgen':' '+fmtDay(endDay,{weekday:'short'}))}); });
  }
  return out; }
function phaseRef(id){ if(!id || !id.includes('#')) return null; const [pid,i]=id.split('#'); const p=pid.includes('@')?detach(pid):S.events.find(x=>x.id===pid); return p&&p.phases&&p.phases[+i]?{p,ph:p.phases[+i]}:null; }
const absNow = e => Math.round((Date.now()-parseYmd(e.date).getTime())/60000);
function phaseDone(r,val){
  const P=r.p.phases, i=P.indexOf(r.ph); r.ph.done=val;
  if(i>=0 && i+1<P.length){ const nx=P[i+1];
    if(val){ const segs=phaseSegs(r.p), now=absNow(r.p); if(Math.abs(now-segs[i].end)>=1 && now>segs[i].abs-60) nx.at=now; }
    else delete nx.at; }
  r.p.done=P.filter(x=>x.kind==='do').every(x=>x.done); save('events'); render(); if(val) hype(r.p.done?'done':'step'); }
function waitFinish(pid,i){ const e=S.events.find(x=>x.id===pid); if(!e) return; const P=e.phases, j=P.findIndex((x,k)=>k>i&&x.kind==='do'); if(j<0) return;
  const now=absNow(e), segs=phaseSegs(e); P[i].dur=Math.max(1,now-segs[i].abs); delete P[i+1].at; if(i+1!==j) P[i+1].at=now; save('events'); render(); toast(`Weiter geht's: ${P[j].t}`); sfx('bell'); }
function waitExtend(pid,i,m){ const e=S.events.find(x=>x.id===pid); if(!e) return; e.phases[i].dur=(+e.phases[i].dur||0)+m; save('events'); render(); toast(`${e.phases[i].t}: +${m} Min`); }
const TPL_BUILTIN = {
  'Wäsche waschen':[['do','Wäsche rein & starten',10],['wait','Maschine läuft',90],['do','Raus & aufhängen',15],['wait','Trocknet',720],['do','Abhängen & wegräumen',15]],
  'Wäsche + Trockner':[['do','Wäsche rein & starten',10],['wait','Maschine läuft',90],['do','Ab in den Trockner',10],['wait','Trockner läuft',120],['do','Rausnehmen & falten',15]],

  'Brot backen':[['do','Teig kneten',15],['wait','Teig geht',60],['do','Formen & in den Ofen',10],['wait','Backt',45],['do','Rausholen',5]]
};
function templates(){ const all={}; Object.entries(TPL_BUILTIN).forEach(([k,v])=>all[k]=v.map(([kind,t,dur])=>({kind,t,dur}))); Object.entries(S.meta.tpl||{}).forEach(([k,v])=>all[k]=v); return all; }
function tplGuess(t){ t=(t||'').toLowerCase(); return /trockner/.test(t)?'Wäsche + Trockner':/wäsche|waschmaschine|waschen/.test(t)?'Wäsche waschen':/spülmaschine|geschirrspüler/.test(t)?'Spülmaschine':/brot/.test(t)?'Brot backen':null; }
const timed = list => list.filter(e=>e.start).sort((a,b)=>toMin(a.start)-toMin(b.start));
const untimed = list => list.filter(e=>!e.start);
const endMin = e => toMin(e.start)+(e.dur||30);
const stepsInfo = e => (e.steps&&e.steps.length)?`${e.steps.filter(s=>s.done).length}/${e.steps.length} Schritte`:'';
const hasExamples = () => S.events.some(e=>e.ex) || S.projects.some(p=>p.ex) || S.migraine.some(m=>m.ex);

function renderTabs(){

function header(title, sub, right=''){
  return `<header class="top"><h1>${title}${sub?`<span class="sub">${sub}</span>`:''}</h1>${right}</header>`;
}

function greet(){ const h=new Date().getHours(); return h<11?'Guten Morgen':h<17?'Hallo':h<22?'Guten Abend':'Gute Nacht'; }

function viewDay(){
  const d=ui.date, isToday=d===todayS(), list=evOn(d);
  const title = isToday ? greet() : fmtDay(d,{weekday:'long'});
  const sub = isToday ? fmtDay(d) : fmtDay(d,{day:'numeric',month:'long',year:'numeric'});
  const nav = `<button class="iconbtn" data-act="dayShift" data-v="-1" aria-label="Vorheriger Tag">${ICON.left}</button>
    ${isToday?'':`<button class="pillbtn" data-act="dayToday">Heute</button>`}
    <button class="iconbtn" data-act="dayShift" data-v="1" aria-label="Nächster Tag">${ICON.right}</button>`;
  let h = header(title, sub, nav) + '<div class="stack">';
  const hr=new Date().getHours();
  if(isToday && !S.meta.planned[d]) h += nudge(d,'Plane deinen Tag', sleepMode()==='low'?'Kurze Nacht: Plane heute weniger und mehr Pausen. Zwei Minuten reichen.':'Zwei Minuten: Was steht fest, was ist am wichtigsten?','Jetzt planen');
  else if(isToday && hr>=17 && !S.meta.planned[addDays(d,1)]) h += nudge(addDays(d,1),'Morgen schon geplant?','Kurz vorplanen macht den Morgen leichter.','Morgen planen');
  else if(!isToday && !S.meta.planned[d] && d>todayS()) h += nudge(d,'Diesen Tag vorplanen?','Wichtigste Sache und feste Termine festhalten.','Planen');
  if(isToday && hr<12){ const y=addDays(d,-1); if(!(S.meta.closed||{})[y]){ const yl=evOn(y); if(yl.length){ const yd=yl.filter(e=>e.done).length+(((S.meta.wins||{})[y])||[]).length, yo=list.filter(e=>!e.done && e.origDate && e.origDate<d).length;
    h += `<button class="yday" data-act="deYesterday"><span class="grow"><b>Gestern: ${yd} ${yd===1?'Sieg':'Siege'}</b>${yo?` · ${yo} ${yo===1?'Sache ist':'Sachen sind'} heute dran`:''}</span><span class="hint">Ansehen</span></button>`; } } }
  if(isToday) h += nowCard(list, waitsOn(d));
  if(isToday && hr>=18) h += `<div class="tmrcard"><span class="knob orb">${ICON.orb}</span><div class="grow"><b>Ein Blick auf morgen</b><span>Die Seherin hat die Knochen schon geworfen.</span></div><button class="btn small" data-act="showTomorrow">Hellsehen</button></div>`;
  if(isToday){ const n=nowMin(); const miss=timed(list).find(e=>!e.done && !e.missAck && endMin(e)<=n);
    if(miss) h += `<div class="card stack cat-${miss.cat}" style="gap:12px;border:2.5px solid var(--c)"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="swatch" style="width:14px;height:14px;margin-top:4px"></span><div class="grow"><span class="label">Verpasst oder vergessen?</span><br><b style="font-size:18px">${esc(miss.title)}</b> <span class="hint num">${miss.start}–${fromMin(endMin(miss))}</span></div></div>
      <div class="row">${miss.ph?`<button class="btn small" data-act="missDone" data-id="${miss.id}">Erledigt</button><button class="btn small ghost" data-act="missAck" data-id="${miss.id}">Lassen</button>`:`<button class="btn small" data-act="missNow" data-id="${miss.id}">Jetzt nachholen</button><button class="btn small ghost" data-act="missDone" data-id="${miss.id}">War erledigt</button><button class="btn small ghost" data-act="missTomorrow" data-id="${miss.id}">Morgen</button><button class="btn small ghost" data-act="missAck" data-id="${miss.id}">Lassen</button>`}</div></div>`; }
  if(S.meta.focusOf[d]) h += `<div class="focuschip"><div class="grow"><span class="label">Wichtigste Sache</span><b>${esc(S.meta.focusOf[d])}</b></div><button class="pillbtn" data-act="plan" data-v="${d}">Ändern</button></div>`;
  if(list.length){ const sorted=[...timed(list),...untimed(list)], dn=list.filter(e=>e.done).length;

function nowCard(list, wts=[]){

    h+=`<div class="next cat-${w.cat}" style="flex-wrap:wrap"><span class="hglass">${ICON.hourglass}</span><button class="grow" style="border:0;background:none;color:inherit;text-align:left;padding:0;min-width:0" data-act="openEvent" data-id="${w.pid}"><span class="label" style="display:block">Läuft gerade · fertig ${esc(w.endTxt)}</span><b>${esc(w.ptitle)}: ${esc(w.t)}</b><span class="countdown num" style="display:block;font-size:16px;margin-top:2px">noch ${dur(left)}</span></button>
      <div class="row" style="flex:1 1 100%;gap:8px"><button class="btn small" data-act="waitDone" data-id="${w.pid}" data-i="${w.i}">Schon fertig</button><button class="btn small ghost" style="background:color-mix(in srgb,var(--now-fg) 18%,transparent);color:inherit" data-act="waitMore" data-id="${w.pid}" data-i="${w.i}">+15 Min</button></div></div>`; });

/* Suggest free slots for untimed tasks (first fit, 5 min buffer) */
function ghostSlots(d,list){
  const t=todayS(); if(d<t) return [];
  const open=untimed(list).filter(e=>!e.done); if(!open.length) return [];
  const BUF=10, dayEnd=dayEndMin();
  let from = d===t ? Math.ceil((nowMin()+BUF)/5)*5 : 8*60;
  const busy=timed(list).map(e=>[toMin(e.start),endMin(e)]);
  const out=[]; out.over=[];
  for(const e of open){
    const du=e.dur||30; let st=Math.max(from,0), g=0, h;
    const hits=x=>busy.filter(([a,b])=>x<b+BUF && x+du+BUF>a);
    while((h=hits(st)).length && g++<80) st=Math.ceil((Math.max(...h.map(z=>z[1]))+BUF)/5)*5;
    if(st+du>dayEnd){ out.over.push(e); continue; }
    out.push({e,start:st}); busy.push([st,st+du]);
  }
  return out;
}
function timeline(tm,isToday,gh=[],wt=[]){
  const RAIL=wt.length?30:0;
  const PX=1.1;
  let sh=7, eh=22;
  tm.forEach(e=>{ sh=Math.min(sh,Math.floor(toMin(e.start)/60)); eh=Math.max(eh,Math.ceil(endMin(e)/60)); });
  gh.forEach(g=>{ sh=Math.min(sh,Math.floor(g.start/60)); eh=Math.max(eh,Math.ceil((g.start+(g.e.dur||30))/60)); });
  if(isToday){ const n=nowMin(); sh=Math.min(sh,Math.floor(n/60)); eh=Math.max(eh,Math.ceil((n+1)/60)); }
  eh=Math.min(eh,24);
  const top=m=>(m-sh*60)*PX, H=(eh-sh)*60*PX;
  // overlap columns
  const cols=[]; const pos={};
  let cluster=[], clusterEnd=-1;
  const flush=()=>{ const n=Math.max(...cluster.map(c=>pos[c.id].col))+1; cluster.forEach(c=>pos[c.id].n=n); cluster=[]; };
  tm.forEach(e=>{
    const s=toMin(e.start);
    if(s>=clusterEnd && cluster.length){ flush(); cols.length=0; }
    let c=cols.findIndex(end=>end<=s); if(c<0){ c=cols.length; cols.push(0); }
    cols[c]=endMin(e); pos[e.id]={col:c}; cluster.push(e); clusterEnd=Math.max(clusterEnd,endMin(e));
  });
  if(cluster.length) flush();
  let h=`<div class="tl" data-sh="${sh}" data-px="${PX}" style="height:${H}px">`;
  for(let i=sh;i<=eh;i++) h+=`<div class="hr num" style="top:${top(i*60)}px"><span>${pad(i%24)}:00</span></div>`;
  tm.forEach(e=>{
    const p=pos[e.id], w=100/p.n;
    const ht=Math.max((e.dur||30)*PX,30);
    const L=`calc((100% - ${RAIL}px) * ${p.col/p.n} + 6px)`, Wd=`calc((100% - ${RAIL}px) / ${p.n} - 8px)`, T=top(toMin(e.start))+1;
    h+=`<button class="blkchk cat-${e.cat} ${e.done?'on':''}" style="top:${T+Math.min(7,(ht-30)/2)}px;left:calc(${L} + ${Wd} - 36px)" data-act="toggleDone" data-id="${e.id}" aria-label="${esc(e.title)} ${e.done?'nicht mehr ':''}erledigt">${e.done?ICON.tick:''}</button>`;
    h+=`<button class="blk cat-${e.cat} ${e.done?'done':''} ${ht<=44?'tiny':''}" style="top:${T}px;height:${ht-2}px;left:${L};width:${Wd};padding-right:40px" data-act="openEvent" data-id="${e.id}">
      <b>${e.rep?'<span aria-label="Serie">↻ </span>':''}${esc(e.short||e.title)}</b>${ht>44?`<small class="num">${e.start}–${fromMin(endMin(e))}${stepsInfo(e)?' · '+stepsInfo(e):''}</small>`:''}</button>`;
  });
  gh.forEach(g=>{ const e=g.e, ht=Math.max((e.dur||30)*PX,30);
    h+=`<button class="blk ghost cat-${e.cat}" style="top:${top(g.start)+1}px;height:${ht-2}px;left:6px;width:calc(100% - 8px - ${RAIL}px)" data-act="ghostPlace" data-id="${e.id}" data-v="${fromMin(g.start)}" aria-label="${esc(e.title)} um ${fromMin(g.start)} einplanen">
      <b>${esc(e.title)}</b>${ht>44?`<small class="num">Vorschlag ${fromMin(g.start)}–${fromMin(g.start+(e.dur||30))} · tippen zum Einplanen</small>`:`<small class="num">${fromMin(g.start)} · tippen</small>`}</button>`; });
  wt.forEach(w=>{ const a=Math.max(w.s,sh*60), b=Math.min(w.e,eh*60); if(b<=a) return;
    h+=`<button class="waitbar cat-${w.cat}" style="top:${top(a)}px;height:${Math.max((b-a)*PX,26)}px" data-act="openEvent" data-id="${w.pid}" aria-label="${esc(w.ptitle)}: ${esc(w.t)} bis ${esc(w.endTxt)}"><span>${ICON.hourglass}</span></button>`; });
  if(isToday) h+=`<div class="nowline" style="top:${top(nowMin())}px"></div>`;
  return h+'</div>';
}

const SLEEPQ = ['sehr schlecht','schlecht','okay','gut','sehr gut'];
const sleepTxt = d => { const z=S.sleep[d]; if(!z||(!z.q&&!z.h)) return ''; return [z.q?SLEEPQ[z.q-1]:'', z.h?`${z.h>=9?'9+':z.h<=4?'≤4':z.h} Std`:''].filter(Boolean).join(', '); };
const sleepPoor = d => { const z=S.sleep[d]; return !!z && ((z.q&&z.q<=2) || (z.h&&z.h<=5)); };
function sleepInsight(){
  const since=addDays(todayS(),-89), mig=new Set(S.migraine.filter(x=>x.date>=since).map(x=>x.date));
  const A=[],B=[]; Object.entries(S.sleep).forEach(([d,z])=>{ if(d<since||!z) return; (mig.has(d)?A:B).push(z); });
  const avg=(arr,k)=>{ const v=arr.map(z=>z[k]).filter(Boolean); return v.length?(v.reduce((a,b)=>a+b,0)/v.length):null; };
  if(A.length<2 || B.length<3) return null;
  return {n:A.length, hA:avg(A,'h'), hB:avg(B,'h'), qA:avg(A,'q'), qB:avg(B,'q')};
}

    ['Outlook / Microsoft 365',`<ol><li><b>Outlook am PC</b>: Kalender öffnen → <b>Datei</b> → <b>Kalender speichern</b> → Zeitraum „Gesamter Kalender“ wählen → als .ics speichern.</li><li><b>Outlook im Browser</b>: Einstellungen → Kalender → <b>Freigegebene Kalender</b> → „Kalender veröffentlichen“ → den <b>ICS-Link</b> öffnen, dann lädt die Datei herunter.</li><li>Die .ics-Datei aufs Handy bringen und hier auswählen.</li></ol>`],
    ['Apple Kalender (iPhone, Mac)',`<ol><li>Am <b>Mac</b>: Kalender-App → links den Kalender wählen → <b>Ablage</b> → <b>Exportieren</b> → .ics speichern.</li><li>Am iPhone selbst gibt es leider keinen Export. Nutzt du iCloud, geht es nur über den Mac. Liegen deine Termine eigentlich bei Google oder Outlook, exportiere sie dort.</li></ol>`],
    ['Andere Kalender',`<p>Fast jeder Kalender kann eine <b>.ics</b>- oder <b>iCal</b>-Datei exportieren, zum Beispiel Proton, Thunderbird, GMX, Web.de oder Samsung über Google. Such in den Einstellungen nach „Exportieren“ oder „iCal“.</p>`]];
  h+=`<span class="label">So bekommst du die Datei</span><div class="extras hq">${HOW.map(([t,b],i)=>`<div class="xrow ${o[i]?'open':''}" style="--k:var(--c${i+1})"><button class="xhead" data-act="icsHow" data-v="${i}" aria-expanded="${!!o[i]}"><span class="grow"><b>${t}</b></span>${XI.chev}</button><div class="xbody" ${o[i]?'':'hidden'}>${b}</div></div>`).join('')}</div>`;
  const n=S.events.filter(e=>e.src==='ics').length;
  if(n) h+=`<div class="card stack"><span class="label">Importierte Termine</span><p class="hint">${n} Einträge stammen aus einem Import.</p><button class="btn ghost" data-act="icsRemove">Alle importierten Termine entfernen</button></div>`;
  return h+'</div>';
}
async function icsLoadFiles(files){
  toast('Ich lese deinen Kalender …');
  const texts=[], errs=[];
  for(const f of files){ try{
      const buf=await f.arrayBuffer(); const u8=new Uint8Array(buf);
      if(u8[0]===0x50 && u8[1]===0x4B){
        if(typeof DecompressionStream==='undefined'){ errs.push('zip'); continue; }
        const inner=await unzipIcs(buf); if(!inner.length) errs.push('emptyzip'); texts.push(...inner); }
      else texts.push({name:f.name,text:new TextDecoder().decode(u8)});
    }catch(e){ errs.push('read'); } }
  let items=[]; try{ items=texts.flatMap(t=>icsParse(t.text)); }catch(e){ errs.push('parse'); }
  ui.tool='import'; ui.tab='tools'; ui.ics=ui.ics||{allday:true};
  if(!items.length){ ui.ics.res=null; ui.ics.err=errs.includes('zip')?'Dein Handy kann .zip-Dateien hier nicht entpacken. Entpack die Datei zuerst (in der Dateien-App antippen) und wähl dann die .ics-Datei darin.'
      : errs.includes('emptyzip')?'In der .zip-Datei ist keine Kalenderdatei (.ics). Bei Google heißt der Export meist „deinname@gmail.com.ical.zip“.'
      : errs.length?'Diese Datei kann ich nicht lesen. Ist es wirklich eine .ics- oder .zip-Datei aus dem Kalender-Export?'
      : 'In der Datei habe ich keine Termine gefunden.';
    render(); return; }
  try{ ui.ics.err=null; ui.ics.files=texts.length; ui.ics.res=icsBuild(items,{allday:ui.ics.allday}); }
  catch(e){ ui.ics.err='Beim Lesen ist etwas schiefgegangen ('+esc(e.message||e)+'). Schick Claude im Chat gern die Fehlermeldung.'; }
  render(); window.scrollTo(0,0);
}

};

  ['Verschieben & verpasst','--c4',`<p>Termine dürfen sich nicht überschneiden. Passiert es doch, biete ich dir die nächste freie Zeit an. Jeder Eintrag ist <b>fest</b> (Arzt, Termine) oder <b>flexibel</b>. Verschiebst du etwas, schlage ich vor, wie Flexibles mitrutscht. Feste Termine bleiben stehen.</p><p>Ist etwas vorbei und nicht abgehakt, frage ich: nachholen, erledigt, morgen oder lassen.</p><p class="say">„Rückschläge sind kein Rückzug. Wir sortieren neu und weiter geht's.“</p>`],
  ['Erinnerungen','--c3',`<p>Pro Eintrag einstellbar unter Extras → Erinnerung. Sie kommen mit Ton und Banner, solange die App geöffnet ist oder im Hintergrund noch läuft.</p><p>Mitteilungen erlaubst du unter <b>Tools → Sichern & Übertragen</b>. Ist die App ganz geschlossen, kann sie dich leider nicht erinnern. Für Wichtiges stell dir zusätzlich einen Wecker.</p>`],
  ['Quests & Gold','--c3',`<p>Tipp unten auf die <b>Goldmünze</b>. Sag mir, wie viel Kraft du hast (wenig, mittel, viel), und ich ziehe dir eine <b>Quest</b>, die in deine freie Zeit passt: Haushalt, Papierkram, Soziales, Körper, Digitales und Dinge für dein Morgen-Ich.</p>

    <p>In der <b>Schatzkammer</b> legst du Belohnungen mit Preis an und löst sie ein. Richtwert: An einem guten Tag verdienst du 15 bis 20 Gold. Klein: 20–30, mittel: um 100, groß: 300–500.</p>

  ['Tagesabschluss','--c4',`<p>Ab 20 Uhr erscheint über dem roten Plus der Knopf mit den <b>drei Z</b>. Tippst du ihn an, stehe ich auf meinem Siegeshügel und gehe den Tag mit dir durch:</p>
    <ul><li><b>Deine Siege</b>: alles, was du abgehakt hast. Hast du das Wichtigste des Tages geschafft, steht es ganz oben. Dazu das Gold aus deinen Quests.</li>

  ['Fokus','--c6',`<p>Die <b>Zielscheibe</b> unten öffnet den Fokus: ein schwarzer Bildschirm mit weißer Schrift. Du siehst nur, was <b>jetzt</b> dran ist, wie lange noch, und was <b>als Nächstes</b> kommt. Mit <b>Geschafft</b> hakst du den jetzigen Termin ab. Der Bildschirm bleibt an, solange der Fokus offen ist. Oben rechts beendest du ihn.</p><p>Ist gerade nichts dran, steht dort „Durchatmen“. Für freie Zeit gibt es die Quests.</p><p class="say">„Ein Schritt nach dem anderen. So erobert man Burgen. Und Küchen.“</p>`],

  ['Mini-Schritte & Timer','--c6',`<p>Große Aufgabe? Unter Extras → <b>Mini-Schritte</b> in kleine Häppchen teilen. Im <b>Timer</b>-Tab läuft ein Zeitmesser, der die Zeit sichtbar macht, und du hakst dort die Schritte ab.</p><p class="say">„Fünf Minuten anfangen ist besser als eine Stunde drüber nachdenken.“</p>`],
  ['Monat','--c1',`<p>Der Monatsüberblick mit farbigen Punkten pro Eintrag und einer roten Raute an Migränetagen. Tipp auf einen Tag, um ihn zu öffnen.</p>`],
  ['Schlaf & Migräne','--c4',`<p>Morgens über den <b>Schlaf-Check</b> im Tag eintragen, wie du geschlafen hast. Ältere Nächte findest du unter <b>Tools → Schlaf</b>. Im <b>Migränetagebuch</b> siehst du den Schlaf der Nacht davor, eine Schlaf-Leiste und nach ein paar Wochen eine Auswertung. Bei einer schlechten Nacht schlage ich „Wenig Schlaf“ als Auslöser vor.</p><p>Die Auswertung ersetzt keinen Arzt, hilft dir aber, Muster zu erkennen.</p>`],
  ['Zyklus','--c5',`<p>Zuerst unter <b>Tools → Einstellungen</b> die Zyklus-Funktion einschalten. Dann trägst du unter <b>Tools → Zyklus</b> deine Periode ein: Blutungsstärke, Symptome, Stimmung und mehr. Daraus berechne ich deine nächste Periode, die fruchtbaren Tage und den Eisprung. Im Monat siehst du alles farbig markiert, im Migränetagebuch die Periodentage neben deinen Attacken.</p><p>Die Vorhersagen sind Schätzungen und kein Verhütungsmittel.</p>`],

  ['Leona & Einstellungen','--c5',`<p>Unter <b>Tools → Leona</b> schaltest du mich aus oder auf „nur Sprechblase“. Wie kannst du nur.</p><p>Unter <b>Tools → Einstellungen</b>: ruhiger Modus ohne Animationen, Töne und Vibration.</p><p><b>Klänge</b>: Schwertklirren mit Schlachtlärm beim Abhaken, Harfe bei Mini-Schritten, Laute beim Eintragen, Fanfare wenn der Tag geschafft ist, Gong nach dem Timer, Münzklimpern bei Quests und Knochenklappern beim Hellsehen. Klänge und Schlachtgetümmel schaltest du unter Einstellungen einzeln ab.</p>`],
  ['Kalender importieren','--c2',`<p>Unter <b>Tools → Kalender importieren</b> übernimmst du deine Termine aus Google, Outlook, Apple und fast jedem anderen Kalender. Exportier dort eine <b>.ics</b>-Datei (bei Google eine <b>.zip</b>) und wähl sie hier aus. Wie der Export geht, steht im Tool für jeden Kalender einzeln.</p>
    <ul><li>Termine mit Uhrzeit werden <b>feste</b> Termine. Serien wie wöchentlich, alle 2 Wochen, monatlich oder jährlich bleiben Serien, mit Ausnahmen und Enddatum.</li><li>Ganztägige Einträge wie Geburtstage werden Aufgaben ohne Uhrzeit, die nicht auf den nächsten Tag rutschen. Du kannst sie auch weglassen.</li><li>Vergangene Termine lasse ich weg. Importierst du erneut, werden schon übernommene Termine nur aktualisiert, nicht doppelt angelegt.</li><li>Ganz spezielle Serien wie „jeden 1. Dienstag im Monat“ übernehme ich nur mit dem ersten Termin.</li></ul>
    <p>Es ist eine einmalige Übernahme. Neue Termine im alten Kalender kommen erst beim nächsten Import dazu.</p>`],
  ['Sicherung & neues Handy','--c1',`<p>Deine Daten liegen <b>nur auf diesem Handy</b>. Unter <b>Tools → Sichern & Übertragen</b> erstellst du eine Sicherungsdatei. Leg sie in iCloud oder Google Drive. Auf einem neuen Handy: App öffnen, „Sicherung laden“, fertig.</p>`],
  ['Installieren, offline & Updates','--c6',`<p><b>iPhone:</b> Link in Safari öffnen → Teilen → „Zum Home-Bildschirm“.<br><b>Android:</b> Link in Chrome öffnen → ⋮ → „App installieren“.</p><p>Danach läuft die App auch <b>ohne Internet</b>. Updates kommen automatisch, wenn du sie mit Internet öffnest. Öffne sie immer über das Symbol, nicht über den Browser.</p>`]

/* ---------- Cycle (period tracking) ---------- */
const PINK='#F2559A';
const FLOW=[['schmier','Schmierblutung'],['leicht','Leicht'],['mittel','Mittel'],['stark','Stark']];
const CYC_SYM=['Krämpfe','Kopfschmerzen','Rückenschmerzen','Brustspannen','Blähungen','Müdigkeit','Übelkeit','Heißhunger','Unreine Haut','Schlafprobleme'];
const CYC_MOOD=['Ausgeglichen','Energiegeladen','Gereizt','Traurig','Ängstlich','Empfindlich'];
const CYC_DIS=['Trocken','Klebrig','Cremig','Wässrig','Wie Eiweiß'];
const cyDays=()=>{ S.cycle=S.cycle||{days:{},set:{len:28,plen:5}}; S.cycle.days=S.cycle.days||{}; S.cycle.set=S.cycle.set||{len:28,plen:5}; return S.cycle.days; };
const dDiff=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
function cycPeriods(){ const D=cyDays(); const ds=Object.keys(D).filter(d=>D[d].flow && D[d].flow!=='schmier').sort(); const P=[]; let cur=null;
  ds.forEach(d=>{ if(cur && dDiff(cur.end,d)<=2){ cur.end=d; cur.len=dDiff(cur.start,d)+1; } else { cur={start:d,end:d,len:1}; P.push(cur); } }); return P; }
function cycInfo(){ cyDays(); const P=cycPeriods(), set=S.cycle.set, t=todayS();
  const lens=[]; for(let i=1;i<P.length;i++){ const L=dDiff(P[i-1].start,P[i].start); if(L>=15&&L<=60) lens.push(L); }
  const rl=lens.slice(-6), len=rl.length?Math.round(rl.reduce((a,b)=>a+b,0)/rl.length):(+set.len||28);
  const pl=P.slice(-6).map(p=>p.len), plen=pl.length?Math.round(pl.reduce((a,b)=>a+b,0)/pl.length):(+set.plen||5);
  const last=P[P.length-1]||null; if(!last) return {P,len,plen,lens,last:null};
  const day=dDiff(last.start,t)+1, next=addDays(last.start,len), ovu=addDays(next,-14), fs=addDays(ovu,-5), fe=addDays(ovu,1);
  const inPeriod = (t>=last.start && t<=last.end) || (dDiff(last.end,t)===1 && day<=plen && !cyDays()[t]);

  const sm=sleepMode(); const du=e.dur||30; if(sm==='low'){ s+= du<=30?10: du>60?-12:0; } else if(sm==='high'){ s+= du>=45?5:0; }

/* ---------- no overlaps ---------- */
function segsOf(e){
  if(!e.start) return [];
  if(hasPh(e)) return phaseSegs(e).filter(g=>g.p.kind==='do').map(g=>({date:addDays(e.date,Math.floor(g.abs/1440)), s:g.abs%1440, e:g.abs%1440+Math.max(5,+g.p.dur||5)}));
  return [{date:e.date, s:toMin(e.start), e:toMin(e.start)+(e.dur||30)}];
}
function overlapsFor(e){
  const out=[], seen=new Set();
  for(const g of segsOf(e)){
    for(const x of timed(evOn(g.date))){
      if(x.id===e.id || x.master===e.id || (x.ph && (x.ph.pid===e.id || x.ph.pid.split('@')[0]===e.id)) || x.done || seen.has(x.id)) continue;
      if(g.s < endMin(x) && g.e > toMin(x.start)){ out.push(x); seen.add(x.id); }
    }
  }
  return out;
}
function nextFreeStart(e){
  const base=toMin(e.start), lastStart=hasPh(e)?23*60+55:24*60-(e.dur||30);
  const c={...e};
  for(let m=base; m<=lastStart; m+=5){ c.start=fromMin(m); if(!overlapsFor(c).length) return c.start; }
  return null;
}
function sheetConflict(a){
  const ev=S.events.find(x=>x.id===a.id); if(!ev) return '<button class="btn" data-act="closeSheet">Schließen</button>';
  const ov=overlapsFor(ev), free=nextFreeStart(ev);
  return `<h2>Das überschneidet sich</h2>
  <p style="margin:0"><b>${esc(ev.title)}</b> um <b class="num">${ev.start}</b> kollidiert mit:</p>

  <span class="hint">Zwei Dinge gleichzeitig klappen selten. Such dir aus, wie wir das lösen:</span>
  ${free?`<button class="btn" data-act="cfMove">Auf ${free} legen (nächste freie Zeit)</button>`:'<span class="hint">Heute ist keine passende Lücke mehr frei.</span>'}

/* ---------- rescheduling ---------- */
const isFixed = e => e.fixed ?? (e.cat==='termin' || e.cat==='gesund');
function planShift(id, buf){
  const a=S.events.find(x=>x.id===id); if(!a || !a.start) return {changes:[],conflicts:[]};
  const day=timed(evOn(a.date)).filter(x=>!x.done && x.id!==a.id && x.master!==a.id && !(x.ph && x.ph.pid.split('@')[0]===a.id));
  const aS=toMin(a.start), aE=endMin(a);
  const conflicts=day.filter(x=>isFixed(x) && aS<endMin(x) && aE>toMin(x.start));
  const busy=[...day.filter(isFixed).map(x=>[toMin(x.start),endMin(x)]),[aS,aE]];
  const hits=(st,d)=>busy.filter(([b0,b1])=>st<b1 && st+d>b0);
  const changes=[]; let cursor=aE+buf;
  const flex=day.filter(x=>!isFixed(x) && endMin(x)>aS).sort((p,q)=>toMin(p.start)-toMin(q.start));
  for(const x of flex){
    const d=x.dur||30; let st=toMin(x.start);
    if(!hits(st,d).length){ busy.push([st,st+d]); continue; }
    st=Math.ceil(Math.max(st,cursor)/5)*5;
    let g=0, h; while((h=hits(st,d)).length && g++<60) st=Math.ceil((Math.max(...h.map(z=>z[1]))+buf)/5)*5;
    if(st+d>23*60) changes.push({x,from:x.start,to:x.start,toDate:addDays(x.date,1)});
    else { changes.push({x,from:x.start,to:fromMin(st)}); busy.push([st,st+d]); cursor=st+d+buf; }
  }
  return {changes,conflicts};
}
function offerShift(id){ const p=planShift(id,5); if(p.changes.length||p.conflicts.length){ openSheet('shift',{id,buf:5}); return true; } return false; }
function sheetShift(a){
  const ev=S.events.find(x=>x.id===a.id); if(!ev) return '<button class="btn" data-act="closeSheet">Schließen</button>';

function parseQuick(txt){
  let t=' '+txt.replace(/\s+/g,' ')+' '; const r={};
  let m=t.match(/\s(\d{1,2})\.(\d{1,2})\.(\d{2,4})?(?=\s)/);
  if(m){ let y=m[3]?+m[3]:new Date().getFullYear(); if(y<100) y+=2000; r.date=`${y}-${pad(+m[2])}-${pad(+m[1])}`; t=t.replace(m[0],' '); }
  const days={'heute':0,'morgen':1,'übermorgen':2};
  m=t.match(/\s(heute|übermorgen|morgen)(?=\s)/i); if(m){ r.date=addDays(todayS(),days[m[1].toLowerCase()]); t=t.replace(m[0],' '); }
  const wd=['sonntag','montag','dienstag','mittwoch','donnerstag','freitag','samstag'];
  m=t.match(/\s(?:am\s+)?(sonntag|montag|dienstag|mittwoch|donnerstag|freitag|samstag|so\.|mo\.|di\.|mi\.|do\.|fr\.|sa\.)(?=\s)/i);
  if(m){ const k=m[1].toLowerCase().replace('.',''); const i=wd.findIndex(w=>w===k||w.slice(0,2)===k); if(i>=0){ const n=new Date(); let diff=(i-n.getDay()+7)%7; r.date=addDays(todayS(),diff); t=t.replace(m[0],' '); } }
  m=t.match(/\s(\d+(?:[.,]\d+)?)\s*(h|std\.?|stunden?|min\.?|minuten)(?=\s)/i);
  if(m){ const v=parseFloat(m[1].replace(',','.')); r.dur=/^m/i.test(m[2])?Math.round(v):Math.round(v*60); t=t.replace(m[0],' '); }
  m=t.match(/\s(?:um\s+)?(\d{1,2})[:.](\d{2})(?:\s*uhr)?(?=\s)/i)||t.match(/\s(?:um\s+)?(\d{1,2})\s*uhr(?=\s)/i);
  if(m && +m[1]<24){ r.start=`${pad(+m[1])}:${pad(+(m[2]||0))}`; t=t.replace(m[0],' '); }
  r.title=t.replace(/\s(am|um)\s/gi,' ').replace(/\s+/g,' ').trim();
  const low=r.title.toLowerCase();
  if(/arzt|zahn|physio|therap|apothek|termin beim|praxis|blut/.test(low)) r.cat='gesund';
  else if(/meeting|arbeit|büro|call|projekt|abgabe|mail|bewerb/.test(low)) r.cat='arbeit';
  else if(/putz|wäsche|einkauf|müll|koch|aufräum|spül|staubsaug|bad /.test(low+' ')) r.cat='haushalt';
  else if(/pause|ausruh|schlaf|nap|meditat/.test(low)) r.cat='pause';
  else if(/kino|sport|treffen|spazier|freund|party|gym|yoga|spiel/.test(low)) r.cat='freizeit';
  return r;
}

function seeded(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return ((h^=h>>>16)>>>0)/4294967296; }; }
function boneMat(d,tm,ut,focus){

    ${red?`<path d="M 0 ${-r-5} L ${r*.75} ${-r*.2} L ${r*.55} ${r} L 0 ${r*.6} L ${-r*.55} ${r} L ${-r*.75} ${-r*.2} Z" fill="#B3122E" stroke="#0A0A0A" stroke-width="1.4"/><path d="M 0 ${-r} L ${r*.4} ${-r*.1} L 0 ${r*.3} L ${-r*.4} ${-r*.1} Z" fill="#F2D7DB" opacity=".9"/>`

  let items=''; const bones=tm.slice(0,7), stones=ut.slice(0,8), segs=[], pts=[];
  const inMat=(x,y)=>x>cx-128 && x<cx+128 && y>cy-72 && y<cy+72;
  const dSeg=(px,py,[ax,ay,bx,by])=>{ const vx=bx-ax, vy=by-ay, t=Math.max(0,Math.min(1,((px-ax)*vx+(py-ay)*vy)/(vx*vx+vy*vy))); return Math.hypot(px-(ax+t*vx),py-(ay+t*vy)); };
  const segSeg=(A,B)=>Math.min(dSeg(A[0],A[1],B),dSeg(A[2],A[3],B),dSeg(B[0],B[1],A),dSeg(B[2],B[3],A));
  if(!bones.length && !stones.length) items=bone(cx-14,cy-6,32,58,'',0)+bone(cx+12,cy+6,-28,52,'',1);
  if(focus) pts.push([cx,cy,18]);
  bones.forEach((e,i)=>{ let best=null,bs=-1; for(let k=0;k<220;k++){ const x=cx+(rnd()*2-1)*(rx-24), y=cy+(rnd()*2-1)*(ry-10), rot=rnd()*150-75, len=50+rnd()*10; if(!inMat(x,y)) continue;
      const a=rot*Math.PI/180, hx=Math.cos(a)*len/2, hy=Math.sin(a)*len/2, sg=[x-hx,y-hy,x+hx,y+hy]; if(!inMat(sg[0],sg[1])||!inMat(sg[2],sg[3])) continue;
      const sc=Math.min(99,...segs.map(o=>segSeg(sg,o)),...pts.map(p=>dSeg(p[0],p[1],sg)-p[2])); if(sc>bs){ bs=sc; best=[x,y,rot,len,sg]; } if(sc>20) break; }

/* ---------- reminders ---------- */
const notified=new Set(ls.get('notified',[]));
const snoozed=ls.get('snoozed',{});
let alertQ=[];
function checkReminders(){
  const now=Date.now();
  [todayS(),addDays(todayS(),1)].forEach(d=>evOn(d).forEach(e=>{
    if(!e.start || e.remind==null || e.done) return;
    const key=`${e.id}|${e.date}|${e.start}|${e.remind}`;
    if(notified.has(key)) return;
    const st=parseYmd(e.date); st.setHours(...e.start.split(':').map(Number));
    const fire=snoozed[key]||(st.getTime()-e.remind*60000);
    if(now>=fire && now<st.getTime()+(e.dur||30)*60000){
      notified.add(key); delete snoozed[key]; ls.set('notified',[...notified].slice(-300)); ls.set('snoozed',snoozed);
      const left=Math.round((st.getTime()-now)/60000);
      showAlert({cat:e.cat,title:e.title,text:left>0?`${rel(left)} · um ${e.start}${stepsInfo(e)?' · '+stepsInfo(e):''}`:`Jetzt · ${e.start}`,
        actions:[['In 5 Min nochmal','snooze:'+key],['Alles klar','closeAlert']]});
      beep(2); vibe([200,100,200]); sysNotify(e.title, left>0?`${rel(left)} · um ${e.start}`:`Jetzt · ${e.start}`);
    }
  }));
}
function showAlert(a){ alertQ.push(a); if(alertQ.length===1) paintAlert(); }
function paintAlert(){
  const a=alertQ[0]; const r=$('#alertRoot');
  if(!a){ r.innerHTML=''; return; }
  r.innerHTML=`<div class="alert cat-${a.cat}" role="alert"><span class="label" style="color:inherit;opacity:.8">${esc(a.label||'Erinnerung')}</span><b>${esc(a.title)}</b><span>${esc(a.text)}</span><div class="row">${a.actions.map(([l,c],i)=>`<button class="btn small ${i===0&&a.actions.length>1?'ghost':''}" data-act="alertAct" data-v="${esc(c)}">${l}</button>`).join('')}</div></div>`;
}
let actx=null;
document.addEventListener('pointerdown',()=>{ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } else if(actx.state==='suspended') actx.resume().catch(()=>{}); },{passive:true});
/* ---------- Medieval sound world (synthesized, no files) ---------- */
const R=(a,b)=>a+Math.random()*(b-a);
function ac(){ if(!actx) return null; if(actx.state==='suspended') actx.resume().catch(()=>{}); return actx; }
function outN(c){ if(!c._mg){ c._mg=c.createGain(); const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=6; c._mg.connect(comp); comp.connect(c.destination); } c._mg.gain.value=S.meta.calm?0.35:0.75; return c._mg; }
function rvb(c){ if(!c._rv){ const len=Math.floor(c.sampleRate*2.6), ir=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++){ const x=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-x,2.6)*(i<c.sampleRate*.012?0:1); } }
    const cv=c.createConvolver(); cv.buffer=ir; const g=c.createGain(); g.gain.value=.55; cv.connect(g); g.connect(outN(c)); c._rv=cv; } return c._rv; }
const battleOn=()=>S.meta.battle!==false && !S.meta.calm;
function tone(c,{f,t,dur,type='sine',vol=.3,attack=.005,wet=0,to}){ const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(to||outN(c));
  if(wet){ const w=c.createGain(); w.gain.value=wet; g.connect(w); w.connect(rvb(c)); } o.start(t); o.stop(t+dur+.05); return o; }
function noiseB(c,{t,dur,vol=.2,filter='bandpass',freq=3000,q=1,attack=.002,wet=0,to}){ const len=Math.max(1,Math.ceil(c.sampleRate*dur)), bf=c.createBuffer(1,len,c.sampleRate), d=bf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const src=c.createBufferSource(); src.buffer=bf; const fl=c.createBiquadFilter(); fl.type=filter; fl.frequency.setValueAtTime(freq,t); fl.Q.value=q; const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(fl); fl.connect(g); g.connect(to||outN(c)); if(wet){ const w=c.createGain(); w.gain.value=wet; g.connect(w); w.connect(rvb(c)); } src.start(t); src.stop(t+dur+.02); return {fl,g}; }
// one blade striking another: sharp transient, inharmonic ringing with beating, short scrape
function clash(c,t,vol=1,wet=.35,to){
  noiseB(c,{t,dur:.07,vol:.45*vol,filter:'highpass',freq:2800,wet,to});
  const f0=R(1650,2300); [[1,.20,R(.7,1)],[1.47,.13,R(.6,.9)],[2.09,.09,R(.5,.8)],[2.56,.07,.6],[3.42,.045,.45],[4.11,.03,.35]].forEach(([r,v,d])=>{
    tone(c,{f:f0*r,t,dur:d,vol:v*vol,attack:.001,wet,to}); tone(c,{f:f0*r*1.0035,t,dur:d*.8,vol:v*vol*.6,attack:.001,wet,to}); });
  const sc=noiseB(c,{t:t+.02,dur:.28,vol:.16*vol,filter:'bandpass',freq:2200,q:4,attack:.01,wet,to}); sc.fl.frequency.exponentialRampToValueAtTime(6500,t+.27);
}
// distant battle: rumble, roaring crowd, far-away blades and war drums
function battleBed(c,t,dur,lvl=1,roar=0){
  noiseB(c,{t,dur,vol:.22*lvl,filter:'lowpass',freq:170,attack:Math.min(.35,dur/4),wet:.2});
  [[480,6],[1050,7],[2300,8]].forEach(([f,q],k)=>{ const n=noiseB(c,{t,dur,vol:(.11-k*.025)*lvl*(1+roar),filter:'bandpass',freq:f,q,attack:Math.min(.45,dur/3),wet:.6});
    const lfo=c.createOscillator(), dp=c.createGain(); lfo.frequency.value=R(2.5,6); dp.gain.value=(.05-k*.012)*lvl; lfo.connect(dp); dp.connect(n.g.gain); lfo.start(t); lfo.stop(t+dur);
    if(roar){ n.fl.frequency.setValueAtTime(f,t); n.fl.frequency.linearRampToValueAtTime(f*1.25,t+dur*.6); } });
  const far=c.createBiquadFilter(); far.type='lowpass'; far.frequency.value=2600; const fg=c.createGain(); fg.gain.value=.5*lvl; far.connect(fg); fg.connect(rvb(c)); fg.connect(outN(c));
  const n=Math.round(dur*3); for(let i=0;i<n;i++) clash(c,t+R(.1,dur-.35),R(.25,.5),.9,far);
  SFX.drum(c,t+R(.05,.25),.45*lvl); if(dur>1.2) SFX.drum(c,t+dur*R(.45,.6),.4*lvl);
}
const SFX={
  bell(c,t){ [[1,.32,2.6],[2.0,.16,2],[2.76,.11,1.5],[5.4,.05,.9],[8.9,.025,.5]].forEach(([r,v,d])=>tone(c,{f:660*r,t,dur:d,vol:v,attack:.003,wet:.4})); },
  bells(c,t){ SFX.bell(c,t); SFX.bell(c,t+.6); },
  gong(c,t){ [[1,.4,4.6],[1.48,.2,3.6],[2.1,.13,2.8],[2.9,.07,2.2]].forEach(([r,v,d])=>tone(c,{f:98*r,t,dur:d,vol:v,attack:.025,wet:.5})); noiseB(c,{t,dur:.9,vol:.07,filter:'lowpass',freq:600,wet:.4}); },
  sword(c,t){ if(battleOn()) battleBed(c,t-.05,1.9,.85); clash(c,t+.06,1); clash(c,t+.27,.55); },
  harp(c,t){ [523.25,659.25,783.99].forEach((f,i)=>{ tone(c,{f,t:t+i*.09,dur:1.1,type:'triangle',vol:.2,attack:.003,wet:.35}); tone(c,{f:f*2,t:t+i*.09,dur:.4,vol:.045,wet:.3}); }); },
  lute(c,t){ [392,587.33].forEach((f,i)=>{ tone(c,{f,t:t+i*.13,dur:.8,type:'triangle',vol:.24,attack:.002,wet:.3}); tone(c,{f:f*3,t:t+i*.13,dur:.22,vol:.035}); }); },
  drum(c,t,v=1){ const o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(48,t+.3); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.75*v,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+.55);
    o.connect(g); g.connect(outN(c)); const w=c.createGain(); w.gain.value=.4; g.connect(w); w.connect(rvb(c)); o.start(t); o.stop(t+.6); noiseB(c,{t,dur:.12,vol:.1*v,filter:'lowpass',freq:1200,wet:.3}); },
  horn(c,t,notes){ notes.forEach(([f,st,d])=>{ const T=t+st, o=c.createOscillator(), o2=c.createOscillator(), fl=c.createBiquadFilter(), g=c.createGain(); o.type='sawtooth'; o2.type='square'; o.frequency.value=f; o2.frequency.value=f*1.004;
    fl.type='lowpass'; fl.frequency.setValueAtTime(700,T); fl.frequency.linearRampToValueAtTime(2300,T+.08); g.gain.setValueAtTime(.0001,T); g.gain.exponentialRampToValueAtTime(.13,T+.04); g.gain.setValueAtTime(.13,T+Math.max(.05,d-.06)); g.gain.exponentialRampToValueAtTime(.0001,T+d+.14);

  fRepUnit(el){ readEventForm(); const wd=parseYmd(draft.date).getDay(); draft.rep=draft.rep||{n:1,until:null}; draft.rep.f=el.dataset.v; if(el.dataset.v==='w' && !(draft.rep.days&&draft.rep.days.length)) draft.rep.days=[wd]; if(el.dataset.v!=='w') delete draft.rep.days; renderSheet(); },
  fRepDay(el){ readEventForm(); const x=+el.dataset.v, r=draft.rep||(draft.rep={f:'w',n:1,until:null}); r.f='w'; r.days=r.days||[parseYmd(draft.date).getDay()]; const k=r.days.indexOf(x); if(k>=0){ if(r.days.length>1) r.days.splice(k,1); } else r.days.push(x); renderSheet(); },
  fDel(el){ if(!el.dataset.sure){ el.dataset.sure=1; el.textContent='Wirklich löschen? Nochmal tippen'; return; }
    const gone=S.events.find(x=>x.id===draft.id); S.events=S.events.filter(x=>x.id!==draft.id); save('events'); closeSheet();
    toast('Gelöscht', gone?()=>{ S.events.push(gone); save('events'); render(); }:null); },
  fFocus(){ readEventForm(); const i=S.events.findIndex(x=>x.id===draft.id); if(i>=0){ S.events[i]=draft; save('events'); }
    T.taskId=draft.id; ls.set('timer',T); ui.sheets=[]; renderSheet(); ui.tab='focus'; ls.set('tab','focus'); render(); },
  stepDone(el){ const e=evGet(el.dataset.id); const s=e.steps[+el.dataset.i]; s.done=!s.done; save('events'); render(); if(s.done) hype('step'); },
  tSet(el){ stopTick(); T.total=+el.dataset.v*60; T.remaining=T.total; T.endAt=null; ls.set('timer',T); render(); },
  tToggle(){ if(T.endAt){ T.remaining=tLeft(); T.endAt=null; stopTick(); } else { if(tLeft()<=0) T.remaining=T.total; T.endAt=Date.now()+T.remaining*1000; startTick(); } ls.set('timer',T); paintTimer(); },
  tPlus(){ if(T.endAt) T.endAt+=300000; else T.remaining+=300; T.total+=300; ls.set('timer',T); paintTimer(); },
  tReset(){ stopTick(); T.remaining=T.total; T.endAt=null; ls.set('timer',T); paintTimer(); },
  tBreak(){ alertQ.shift(); paintAlert(); T.total=300; T.remaining=300; T.endAt=Date.now()+300000; ls.set('timer',T); startTick(); ui.tab='focus'; render(); },
  alertAct(el){ const v=el.dataset.v; if(v.startsWith('snooze:')){ const k=v.slice(7); snoozed[k]=Date.now()+300000; notified.delete(k); ls.set('snoozed',snoozed); ls.set('notified',[...notified]); alertQ.shift(); paintAlert(); }
    else if(v.includes(':')){ const [fn,id]=v.split(':'); alertQ.shift(); paintAlert(); if(A[fn]) A[fn]({dataset:{id}}); }
    else if(A[v]) A[v](el); },
  closeAlert(){ alertQ.shift(); paintAlert(); },
  openTool(el){ ui.tool=el.dataset.v; render(); window.scrollTo(0,0); },
  closeTool(){ ui.tool=null; render(); },
  newMig(){ openSheet('mig',{}); }, openMig(el){ openSheet('mig',{id:el.dataset.id}); },
  mSide(el){ readMig(); mdraft.side=mdraft.side===el.dataset.v?'':el.dataset.v; renderSheet(); },
  mEff(el){ readMig(); mdraft.effect=mdraft.effect===el.dataset.v?'':el.dataset.v; renderSheet(); },
  mToggle(el){ readMig(); const a=mdraft[el.dataset.k], v=el.dataset.v, i=a.indexOf(v); i>=0?a.splice(i,1):a.push(v); renderSheet(); },
  mSave(){ readMig(); const i=S.migraine.findIndex(x=>x.id===mdraft.id); if(i>=0) S.migraine[i]=mdraft; else S.migraine.push(mdraft); save('migraine'); closeSheet(); hype('mig'); },
  mDel(el){ if(!el.dataset.sure){ el.dataset.sure=1; el.textContent='Wirklich löschen? Nochmal tippen'; return; } const gone=S.migraine.find(x=>x.id===mdraft.id); S.migraine=S.migraine.filter(x=>x.id!==mdraft.id); save('migraine'); closeSheet(); toast('Gelöscht', gone?()=>{ S.migraine.push(gone); save('migraine'); render(); }:null); },
  newProj(){ openSheet('proj',{}); }, openProj(el){ openSheet('proj',{id:el.dataset.id}); },
  pCat(el){ readProj(); pdraft.cat=el.dataset.v; renderSheet(); },
  pNoteAdd(){ readProj(); const t=$('#pNote').value.trim(); if(!t) return; pdraft.notes.unshift({date:todayS(),text:t,pct:pdraft.progress}); renderSheet(); },
  pNoteDel(el){ readProj(); pdraft.notes.splice(+el.dataset.i,1); renderSheet(); },
  pSave(){ readProj(); const t=$('#pNote').value.trim(); if(t) pdraft.notes.unshift({date:todayS(),text:t,pct:pdraft.progress});
    if(!pdraft.name){ $('#pName').focus(); return; } const i=S.projects.findIndex(x=>x.id===pdraft.id); const before=i>=0?S.projects[i].progress:0; if(i>=0) S.projects[i]=pdraft; else S.projects.push(pdraft); save('projects'); closeSheet(); if(pdraft.progress>before) hype('proj'); else toast('Gespeichert'); },
  pDel(el){ if(!el.dataset.sure){ el.dataset.sure=1; el.textContent='Wirklich löschen? Nochmal tippen'; return; } const gone=S.projects.find(x=>x.id===pdraft.id); S.projects=S.projects.filter(x=>x.id!==pdraft.id); save('projects'); closeSheet(); toast('Gelöscht', gone?()=>{ S.projects.push(gone); save('projects'); render(); }:null); },
  async exportData(){
    const data={app:'bunter-kalender',version:1,exported:new Date().toISOString(),data:{events:S.events,migraine:S.migraine,projects:S.projects,mood:S.mood,sleep:S.sleep,cycle:S.cycle,meta:S.meta,quest:S.quest}};
    const name=`leona-sicherung-${todayS()}.json`;
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    let ok=false;
    try{ const file=new File([blob],name,{type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Leona Sicherung'}); ok=true; } }
    catch(e){ if(e && e.name==='AbortError') return; }
    if(!ok){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); }
    ls.set('lastBackup',todayS()); toast('Sicherung erstellt'); render();
  },
  importPick(){ pickFile('.json,application/json',false,fs=>handleBackupFile(fs[0])); },
  importConfirm(el){
    if(!pendingImport) return;
    if(!el.dataset.sure){ el.dataset.sure=1; el.textContent='Sicher? Ersetzt alles auf diesem Handy. Nochmal tippen'; return; }
    const d=pendingImport.data; S.events=d.events||[]; S.migraine=d.migraine||[]; S.projects=d.projects||[]; S.mood=d.mood||{}; S.sleep=d.sleep||{}; S.cycle=d.cycle||{days:{},set:{len:28,plen:5}}; S.meta=Object.assign({planned:{},focusOf:{}},d.meta||{}); S.quest=d.quest||{coins:0,earned:0};
    KEYS.forEach(save); pendingImport=null; toast('Sicherung geladen'); ui.tool=null; ui.tab='day'; ui.date=todayS(); render();
  },
  async notifOn(){ try{ await Notification.requestPermission(); }catch(e){} render(); },
  loadExamples(){
    const d=todayS(), t=addDays(d,1);
    const ex=[
      ['Beispiel: Aufstehen & Frühstück','pause',d,'07:30',45,null,['Glas Wasser trinken','Medikamente nehmen','Frühstück machen']],
      ['Beispiel: Mails beantworten','arbeit',d,'09:00',60,5,['Postfach öffnen','Nur 3 wichtigste Mails','Rest auf morgen schieben']],
      ['Beispiel: Zahnarzt','gesund',d,'11:30',60,30,['Versichertenkarte einstecken','Um 11:05 losgehen']],
      ['Beispiel: Mittagspause','pause',d,'13:00',45,0,[]],
      ['Beispiel: Wäsche waschen','haushalt',d,'',30,null,['Wäsche sortieren','Maschine starten','Timer stellen']],
      ['Beispiel: Spaziergang mit Lea','freizeit',d,'17:30',60,15,[]],
      ['Beispiel: Wocheneinkauf','haushalt',t,'10:00',60,30,['Einkaufsliste schreiben','Taschen einpacken']],
    ];
    ex.forEach(([title,cat,date,start,dur,remind,steps])=>S.events.push({id:uid(),ex:true,title,cat,date,start,dur,remind,steps:steps.map(s=>({t:s,done:false})),done:false}));
    if(!S.projects.length) S.projects.push({id:uid(),ex:true,name:'Beispiel: Steuererklärung',cat:'arbeit',progress:35,next:'Belege aus dem Ordner fotografieren',notes:[{date:addDays(d,-2),text:'Elster-Zugang funktioniert wieder.',pct:35}]});
    if(!S.migraine.length){ S.migraine.push({id:uid(),ex:true,date:addDays(d,-6),start:'15:00',hours:'5',intensity:7,side:'rechts',symptoms:['Lichtempfindlich','Übelkeit'],triggers:['Wenig Schlaf','Bildschirm'],meds:'Beispiel',effect:'etwas',note:'Beispieleintrag'});
      S.migraine.push({id:uid(),ex:true,date:addDays(d,-17),start:'09:00',hours:'3',intensity:4,side:'links',symptoms:[],triggers:['Stress'],meds:'',effect:'',note:'Beispieleintrag'}); }
    save('events'); save('projects'); save('migraine'); ui.scrolled=false; render();
  },
  clearExamples(){ S.events=S.events.filter(e=>!e.ex); S.projects=S.projects.filter(p=>!p.ex); S.migraine=S.migraine.filter(m=>!m.ex); save('events'); save('projects'); save('migraine'); render(); toast('Beispiele entfernt'); },
};
function act(name,el,ev){ if(A[name]) A[name](el,ev); }
document.addEventListener('click',ev=>{ const el=ev.target.closest('[data-act]'); if(!el) return; if(el.dataset.act!=='scrim') ev.stopPropagation(); act(el.dataset.act,el,ev); });
/* swipe between days (opt-in under Tools → Einstellungen) */
(()=>{ let sx=0, sy=0, st=0, ok=false;
  const blocked=t=>t.closest('input,textarea,select,[contenteditable],.chips,.scale,.hourchips,.segs,nav.tabs,.fab,.timeline .ev');
  document.addEventListener('touchstart',e=>{ ok=false; if(S.meta.swipe!==true || ui.tab!=='day' || ui.sheets.length || $('#deRoot').innerHTML || $('#dgRoot').innerHTML || $('#obRoot').innerHTML) return;
    if(e.touches.length!==1) return; const t=e.touches[0]; if(t.clientX<24 || t.clientX>innerWidth-24) return; // leave the system back gesture alone
    if(blocked(e.target)) return; sx=t.clientX; sy=t.clientY; st=Date.now(); ok=true; },{passive:true});
  document.addEventListener('touchend',e=>{ if(!ok) return; ok=false; const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st>700 || Math.abs(dx)<70 || Math.abs(dy)>Math.abs(dx)*0.6) return;
    A.dayShiftSwipe(dx<0?1:-1); vibe(10); },{passive:true});
})();
/* file picker that survives re-renders (the app redraws when returning from the system picker) */
function pickFile(accept,multiple,cb){ let inp=document.getElementById('filePick');
  if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.id='filePick'; inp.setAttribute('aria-hidden','true'); inp.tabIndex=-1; inp.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0'; document.body.appendChild(inp); }
  inp.accept=accept; inp.multiple=!!multiple; inp.value='';
  inp.onchange=()=>{ const fs=[...(inp.files||[])]; if(fs.length) cb(fs); setTimeout(()=>{ inp.value=''; },0); };
  inp.click(); }
function handleBackupFile(f){ const r=new FileReader();
    r.onload=()=>{ const msg=$('#importMsg'); try{ const j=JSON.parse(r.result); if(j.app!=='bunter-kalender'||!j.data) throw 0;
        pendingImport=j; const n=(j.data.events||[]).length, m=(j.data.migraine||[]).length, p=(j.data.projects||[]).length;
        msg.innerHTML=`Gefunden: Sicherung vom ${esc(new Date(j.exported).toLocaleDateString('de-DE'))} mit ${n} Einträgen, ${m} Migräne-Einträgen, ${p} Projekten.<br><button class="btn" style="margin-top:8px" data-act="importConfirm">Diese Sicherung laden</button>`; }
      catch(e){ msg.textContent='Diese Datei ist keine Sicherung von Leona.'; } };
    r.readAsText(f); }
document.addEventListener('change',ev=>{

  if(ev.target.id==='tTask'){ T.taskId=ev.target.value||null; ls.set('timer',T); render(); }
  if(ev.target.id==='moodNote'){ const d=todayS(); (S.mood[d]||(S.mood[d]={})).note=ev.target.value; save('mood'); }
});

/* ---------- boot ---------- */
render();
if(!ls.get('onboarded',false)) showOnboarding(0);
if(T.endAt){ if(tLeft()>0) startTick(); else tickTimer(); }
setInterval(checkReminders,15000); setTimeout(checkReminders,1500);
setInterval(proactiveNudge,60000); setTimeout(proactiveNudge,8000);
setInterval(()=>{ if(ui.tab==='day' && ui.date===todayS() && !ui.sheets.length) softRender(); },30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ checkReminders(); if(T.endAt) tickTimer(); if(!ui.sheets.length) softRender(); } });
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  const hadCtrl=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadCtrl && !reloaded){ reloaded=true; location.reload(); } });
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ r.update().catch(()=>{}); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) r.update().catch(()=>{}); }); }).catch(()=>{});
}
try{ navigator.storage?.persist?.(); }catch(e){}
})();
